name: PHPCS Inspection

on:
  pull_request:
    paths:
      - '**.php'
      - 'phpcs.xml.dist'
      - 'composer.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: Inspect changed PHP files
    runs-on: ubuntu-latest
    steps:
      # A pull_request checkout is the merge commit: first parent is the base
      # branch tip, second is the PR head. Depth 2 is all the diff below needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: cs2pr, composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - id: changes
        name: Collect the PHP files this pull request changes
        run: |
          FILES=$(git diff --name-only HEAD^1 HEAD -- '*.php' \
            | sort -u \
            | while read -r f; do [ -n "$f" ] && [ -f "$f" ] && echo "$f"; done \
            | xargs)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "PHP files changed by this pull request: ${FILES:-none}" >> "$GITHUB_STEP_SUMMARY"

      # No --graceful-warnings: this plugin ships on WordPress.org, where the gate
      # is zero errors and zero warnings.
      - name: Detect coding standard violations
        if: steps.changes.outputs.files != ''
        run: vendor/bin/phpcs ${{ steps.changes.outputs.files }} -q --report=checkstyle | cs2pr
