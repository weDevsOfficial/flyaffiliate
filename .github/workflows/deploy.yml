# Publishes a tagged release to the WordPress.org plugin repository and
# attaches the deployed zip to a GitHub release, as Dokan Lite's deploy does.
#
# Needs the SVN_USERNAME / SVN_PASSWORD repository secrets. See RELEASE.md.
name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: wordpress-org
    permissions:
      # The GitHub release is created with the workflow's token.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          # `npm run release` builds the translation template with WP-CLI.
          tools: composer:v2, wp-cli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the release
        run: npm run release

      - name: WordPress.org plugin deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: flyaffiliate
          BUILD_DIR: ./build/flyaffiliate
          ASSETS_DIR: .wordpress-org

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
