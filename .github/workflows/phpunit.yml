name: PHPUnit

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**.php'
      - 'phpunit.xml'
      - 'composer.json'
      - '.wp-env.json'
      - '.github/workflows/phpunit.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Dokan ${{ matrix.dokan }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
        dokan: ['with', 'without']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # wp-env reads .wp-env.override.json on top of .wp-env.json. The "without"
      # leg drops Dokan from the tests environment entirely, so a @group dokan
      # test that forgot to skip itself fails loudly instead of passing by accident.
      - name: Configure the test environment
        run: |
          if [ "${{ matrix.dokan }}" = "with" ]; then
            PLUGINS='"https://downloads.wordpress.org/plugin/woocommerce.zip","https://downloads.wordpress.org/plugin/dokan-lite.zip"'
          else
            PLUGINS='"https://downloads.wordpress.org/plugin/woocommerce.zip"'
          fi
          cat > .wp-env.override.json <<JSON
          {
            "phpVersion": "${{ matrix.php }}",
            "env": { "tests": { "plugins": [ ${PLUGINS} ] } }
          }
          JSON
          cat .wp-env.override.json

      - name: Start wp-env
        run: npx wp-env start --update

      - name: Run PHPUnit
        run: |
          if [ "${{ matrix.dokan }}" = "with" ]; then
            npm run phpunit
          else
            npm run phpunit:no-dokan
          fi

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
